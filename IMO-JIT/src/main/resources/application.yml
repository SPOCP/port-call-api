server:
  port: 8080
  servlet:
    context-path: /jit

spring:
  application:
    name: Port

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://<YOUR_DB_HOST>:5432/<YOUR_DB_NAME>
    username: <YOUR_DB_USERNAME>
    password: <YOUR_DB_PASSWORD>

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: imo_jit


master-data:
  baseUrl: http://dev-mycargo.ibpaas.pomfret.cloud/api/public/verificationdata












server:
  port: 8080
  servlet:
    context-path: /imomsw

spring:
  application:
    name: Port

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://<DB_HOST>:5432/<DB_NAME>
    username: <DB_USERNAME>
    password: <DB_PASSWORD>

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: imo_jit

#You can add your own url for - OWN_MASTER_DATA_BASEURL , to user your master data
master-data:
  baseUrl: ${OWN_MASTER_DATA_BASEURL:https://freightapi.app.pomfret.cloud/api/public/verificationdata}

#You can add your own url for - OWN_FILE_FLOW_URL , to user your imo-fal document service
fileflow:
  baseUrl: ${OWN_FILE_FLOW_URL:https://freightapi.app.pomfret.cloud/api}
  pdfgenerationpath: /fileflow/template/


# These auth details are used for master-data and fileflow-url
auth:
  username: <AUTH_USERNAME>
  password: <AUTH_PASSWORD>







